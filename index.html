<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Name Maker & Fancy Font Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .header-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .input-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      font-size: 1rem;
      border: 2px solid #6366f1;
      border-radius: 12px;
      outline: none;
      color: #1e293b;
      background: #fff;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #e2e8f0;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 500;
    }

    .tab.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .copy-all-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #334155;
      cursor: pointer;
      font-weight: 600;
    }

    .section-title {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .result-info {
      text-align: left;
      flex-grow: 1;
      margin-right: 12px;
      overflow: hidden;
    }

    .style-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: block;
    }

    .styled-text {
      font-size: 1.05rem;
      color: #0f172a;
      word-break: break-word;
    }

    .copy-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .copy-btn.copied {
      background: #22c55e;
      color: #ffffff;
      border-color: #22c55e;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-icon">✨</div>
    <h1>Stylish Name Maker & Fancy Font Generator</h1>
    <p class="subtitle">Transform your text into beautiful, unique styles. Perfect for social media, gaming profiles, and more!</p>

    <div class="input-card">
      <div class="input-wrapper">
        <span class="input-icon">✏️</span>
        <input type="text" id="userInput" placeholder="Type your name here :)" oninput="generateStyles()">
      </div>

      <div class="tabs">
        <button class="tab active" onclick="filterCategory('all', this)">All</button>
        <button class="tab" onclick="filterCategory('popular', this)">Popular Design</button>
        <button class="tab" onclick="filterCategory('gaming', this)">Gaming</button>
      </div>
    </div>

    <div class="meta-bar">
      <span id="styleCount">0 styles</span>
      <button class="copy-all-btn" onclick="copyAll()">Copy All Styles</button>
    </div>

    <div class="section-title" id="categoryTitle">POPULAR DESIGN</div>

    <div class="results-container" id="results"></div>
  </div>

  <script>
    const transformations = [
      { name: "ROYAL CROWN", category: "popular", fn: text => `꧁༺${text}༻꧂` },
      { name: "COOL BOY", category: "popular", fn: text => `★[${text}]★` },
      { name: "GAMER PRO", category: "gaming", fn: text => `⚔️ ${text} ⚔️` },
      { name: "VIP SYMBOL", category: "popular", fn: text => `👑 ${text} 👑` },
      { name: "DARK SHADOW", category: "gaming", fn: text => `☠️ ${text} ☠️` },
      { name: "FIRE KING", category: "gaming", fn: text => `🔥 ${text} 🔥` },
      { name: "STAR MAKER", category: "popular", fn: text => `✰ ${text} ✰` },
      { name: "LEGEND", category: "gaming", fn: text => `亗 ${text} 亗` }
    ];

    let currentCategory = 'all';

    function generateStyles() {
      const input = document.getElementById('userInput').value || "Your Name";
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';

      const filtered = transformations.filter(item => currentCategory === 'all' || item.category === currentCategory);
      
      document.getElementById('styleCount').innerText = `${filtered.length} styles`;

      filtered.forEach(item => {
        const styledText = item.fn(input);
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-info">
            <span class="style-tag">${item.name}</span>
            <div class="styled-text">${styledText}</div>
          </div>
          <button class="copy-btn" onclick="copyToClipboard('${styledText}', this)">COPY</button>
        `;
        resultsContainer.appendChild(card);
      });
    }

    function filterCategory(category, element) {
      currentCategory = category;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('categoryTitle').innerText = category === 'all' ? 'ALL DESIGNS' : category.toUpperCase();
      generateStyles();
    }

    function copyToClipboard(text, button) {
      navigator.clipboard.writeText(text).then(() => {
        button.innerText = 'COPIED!';
        button.classList.add('copied');
        setTimeout(() => {
          button.innerText = 'COPY';
          button.classList.remove('copied');
        }, 1500);
      });
    }

    function copyAll() {
      const input = document.getElementById('userInput').value || "Your Name";
      const filtered = transformations.filter(item => currentCategory === 'all' || item.category === currentCategory);
      const allText = filtered.map(item => item.fn(input)).join('\n');
      navigator.clipboard.writeText(allText).then(() => {
        alert('All styles copied to clipboard!');
      });
    }

    // Initial run
    generateStyles();
  </script>

</body>
</html>
