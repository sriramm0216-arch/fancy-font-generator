<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Name Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e2e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ff79c6;
        }

        p {
            color: #a9a9b3;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid #bd93f9;
            border-radius: 10px;
            outline: none;
            background: #282a36;
            color: #fff;
            margin-bottom: 20px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .result-card {
            background: #282a36;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #44475a;
            gap: 10px;
        }

        .font-text {
            font-size: 1.1rem;
            word-break: break-word;
            text-align: left;
            overflow-wrap: anywhere;
            flex-grow: 1;
        }

        .copy-btn {
            background: #bd93f9;
            color: #1e1e2e;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .copied {
            background: #50fa7b !important;
            color: #1e1e2e !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Stylish Name Generator</h1>
        <p>अपना नाम लिखें और इंस्टाग्राम/गेमिंग के लिए स्टाइलिश फॉन्ट कॉपी करें</p>

        <input type="text" id="nameInput" class="input-box" placeholder="यहाँ अपना नाम टाइप करें..." oninput="generateStylishNames()">

        <div class="results-container" id="results"></div>
    </div>

    <script>
        const fontStyles = [
            // Bold Serif
            (text) => text.split('').map(c => {
                const code = c.charCodeAt(0);
                if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D400 + (code - 65));
                if (code >= 97 && code <= 122) return String.fromCodePoint(0x1D41A + (code - 97));
                return c;
            }).join(''),

            // Cursive / Script
            (text) => text.split('').map(c => {
                const code = c.charCodeAt(0);
                if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D4D0 + (code - 65));
                if (code >= 97 && code <= 122) return String.fromCodePoint(0x1D4EA + (code - 97));
                return c;
            }).join(''),

            // Gaming Border 1
            (text) => `꧁༺${text}༻꧂`,

            // Gaming Border 2
            (text) => `★彡[${text}]彡★`,

            // Crown Style
            (text) => `👑 ${text} 👑`,

            // Swords Style
            (text) => `⚔️ ${text} ⚔️`,

            // Wings Style
            (text) => `༺${text}༻`
        ];

        function generateStylishNames() {
            const input = document.getElementById('nameInput').value;
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            if (input.trim() === '') return;

            fontStyles.forEach(styleFn => {
                const styledText = styleFn(input);

                const card = document.createElement('div');
                card.className = 'result-card';

                const textSpan = document.createElement('span');
                textSpan.className = 'font-text';
                textSpan.innerText = styledText;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = () => copyToClipboard(styledText, copyBtn);

                card.appendChild(textSpan);
                card.appendChild(copyBtn);
                resultsContainer.appendChild(card);
            });
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                button.innerText = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.innerText = 'Copy';
                    button.classList.remove('copied');
                }, 1500);
            });
        }
    </script>
</body>
</html>
